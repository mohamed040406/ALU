<circle cx="95" cy="290" r="3.4" fill="#303741"/>
<path d="M178 306 H275" class="wire" marker-end="url(#arr)"/>
<circle cx="178" cy="306" r="3.4" fill="#303741"/>
<rect x="275" y="274" width="222" height="48" rx="3" class="box"/>
<text x="386" y="296" class="module" text-anchor="middle">AND</text>
<text x="386" y="317" class="note" text-anchor="middle">a AND b</text>
<path d="M497 298 H651" class="wire" marker-end="url(#arr)"/>
<text x="663" y="303" class="pin" text-anchor="start">010</text>
