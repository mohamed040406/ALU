<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="710" viewBox="0 0 1160 710" role="img" aria-labelledby="title desc">
<title id="title">Logic-unit connections</title><desc id="desc">The registered operand buses fan out to eight four-bit logic functions, including a local two’s-complement circuit on b. Each function drives the indicated input of the binary result selector. The selected four-bit result is zero-extended to eight bits.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#303741"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#20252a}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px;fill:#444b51}.head{font-size:19px;font-weight:700}.module{font-size:16px;font-weight:700}.label{font-size:15px}.note{font-size:13.5px;fill:#41484e}.net{font-family:Consolas,monospace;font-size:15px}.pin{font-family:Consolas,monospace;font-size:13px}.box,.reg{fill:white;stroke:#41484e;stroke-width:1.5}.reg{fill:#e9edf0}.scope{fill:#f7f8f9;stroke:#a6aeb4;stroke-width:1}.wire,.ctrl{fill:none;stroke:#303741;stroke-width:1.6;stroke-linejoin:round}.ctrl{stroke-dasharray:6 4}</style>
<rect width="1160" height="710" fill="white"/>
<text x="32" y="43" class="title" text-anchor="start">Logic unit</text>
<text x="32" y="71" class="subtitle" text-anchor="start">alu_logic_unit   /   Every operation is four bits wide. The selected result is zero-extended to eight bits.</text>
<text x="95" y="117" class="net" text-anchor="middle">a[3:0]</text>
<text x="178" y="117" class="net" text-anchor="middle">b[3:0]</text>
<path d="M95 129 V610" class="wire"/>
<path d="M178 129 V626" class="wire"/>
<rect x="651" y="146" width="159" height="500" rx="3" class="box"/>
<path d="M95 170 H275" class="wire" marker-end="url(#arr)"/>
<circle cx="95" cy="170" r="3.4" fill="#303741"/>
<rect x="275" y="146" width="222" height="48" rx="3" class="box"/>
<text x="386" y="168" class="module" text-anchor="middle">One’s complement</text>
<text x="386" y="189" class="note" text-anchor="middle">~a</text>
<path d="M497 170 H651" class="wire" marker-end="url(#arr)"/>
<text x="663" y="175" class="pin" text-anchor="start">000</text>
<path d="M178 234 H275" class="wire" marker-end="url(#arr)"/>
