<text x="50" y="721" class="net" text-anchor="start">op[2:0], div_zero</text>
<path d="M252 716 H282" class="wire" marker-end="url(#arr)"/>
<rect x="282" y="680" width="325" height="80" rx="3" class="box"/>
<text x="444.5" y="718" class="module" text-anchor="middle">Arithmetic flag logic</text>
<text x="444.5" y="739" class="note" text-anchor="middle">div_zero is the divider’s zero-divisor flag</text>
<path d="M607 698 H683" class="wire" marker-end="url(#arr)"/>
<text x="695" y="703" class="net" text-anchor="start">divide_by_zero = (op == 101) AND div_zero</text>
<path d="M607 742 H683" class="wire" marker-end="url(#arr)"/>
<text x="695" y="747" class="net" text-anchor="start">invalid_op = (op == 110)   [provisional]</text>
