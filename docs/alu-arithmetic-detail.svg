<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1034" viewBox="0 0 1160 1034" role="img" aria-labelledby="title desc">
<title id="title">Arithmetic-unit connections</title><desc id="desc">One four-bit ripple adder handles increment, addition and subtraction. Its sum and carry also feed local borrow correction. Product, quotient, transfer, decrement and reserved zero feed the result selector. Separate flag logic qualifies divide-by-zero and reserved operation. Four full-adder stages are shown with their carry, operand and sum wires.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#303741"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#20252a}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px;fill:#444b51}.head{font-size:19px;font-weight:700}.module{font-size:16px;font-weight:700}.label{font-size:15px}.note{font-size:13.5px;fill:#41484e}.net{font-family:Consolas,monospace;font-size:15px}.pin{font-family:Consolas,monospace;font-size:13px}.box,.reg{fill:white;stroke:#41484e;stroke-width:1.5}.reg{fill:#e9edf0}.scope{fill:#f7f8f9;stroke:#a6aeb4;stroke-width:1}.wire,.ctrl{fill:none;stroke:#303741;stroke-width:1.6;stroke-linejoin:round}.ctrl{stroke-dasharray:6 4}</style>
<rect width="1160" height="1034" fill="white"/>
<text x="32" y="43" class="title" text-anchor="start">Arithmetic unit</text>
<text x="32" y="71" class="subtitle" text-anchor="start">alu_arithmetic_unit   /   op[2:0] selects the result and both flags</text>
<rect x="30" y="100" width="1100" height="515" rx="3" class="scope"/>
<text x="50" y="131" class="head" text-anchor="start">Combinational datapath</text>
<text x="50" y="157" class="note" text-anchor="start">a and b are the registered 4-bit operands. Each selector uses the same 3-bit op.</text>
<rect x="106" y="192" width="190" height="78" rx="3" class="box"/>
<text x="201" y="229" class="module" text-anchor="middle">Adder input select</text>
<text x="201" y="250" class="note" text-anchor="middle">op → x[3:0], z[3:0], cin</text>
<text x="48" y="225" class="net" text-anchor="start">a, b</text>
<path d="M82 221 H106" class="wire" marker-end="url(#arr)"/>
<text x="201" y="181" class="net" text-anchor="middle">op</text>
