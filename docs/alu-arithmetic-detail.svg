<text x="885" y="220" class="pin" text-anchor="start">001, 010   INC / ADD</text>
<text x="885" y="279" class="pin" text-anchor="start">011   |a − b|</text>
<text x="885" y="338" class="pin" text-anchor="start">100   product</text>
