<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="876" viewBox="0 0 1160 876" role="img" aria-labelledby="title desc">
<title id="title">Registered 4-bit ALU</title><desc id="desc">All inputs and output-bank flip-flops share clock and asynchronous reset. Distinct named nets connect input registers, arithmetic and logic units, the 2:1 result mux, status gates and output registers.</desc>
